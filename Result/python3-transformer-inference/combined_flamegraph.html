<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Flamegraph: python3</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      display: flex;
      height: 100vh;
      overflow: hidden;
      font-family: sans-serif;
      background: #fff;
    }
    .panel {
      position: relative;          /* allow overlay badges */
      display: flex;
      flex-direction: column;
      min-width: 0;
      height: 100vh;
      width: 50%;                  /* fixed 50/50 split */
      flex: 0 0 50%;
    }
    .panel object {
      border: none;
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;         /* scale to fit without clipping */
      object-position: left top;   /* anchor top-left */
      background: #fff;
    }
    .badge {
      position: absolute;
      top: 8px;
      left: 8px;
      padding: 2px 8px;
      font-size: 12px;
      line-height: 18px;
      color: #222;
      background: rgba(255,255,255,0.85);
      border: 1px solid #ddd;
      border-radius: 4px;
      z-index: 10;
      pointer-events: none;        /* allow SVG interactions */
    }
  </style>
</head>
<body>
  <div class="panel">
    <div class="badge">CPU Percentage of total time consumed: 97.3%</div>
    <object type="image/svg+xml" data="python3_pyspy.svg" title="CPU 97.3%"></object>
  </div>
  <div class="panel">
    <div class="badge">GPU Percentage of total time consumed: 2.7%</div>
    <object type="image/svg+xml" data="python3_gpu_time.svg" title="GPU 2.7%"></object>
  </div>
</body>
</html>
